name: Windows CMake Build CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_CONFIG: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }}
      
    - name: Build Server GUI
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_CONFIG }} --target myservergui

    - name: Build Client GUI
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_CONFIG }} --target myclientgui

    # -------------------------------------------------------------
    # FILE RENAMING (Only runs on normal branch pushes)
    # -------------------------------------------------------------
    - name: Rename Files with Debug Suffix
      if: "!startsWith(github.ref, 'refs/tags/')"
      shell: pwsh
      run: |
        Move-Item "${{github.workspace}}/build/Debug/serverGUI.exe" "${{github.workspace}}/build/Debug/serverGUI_debug.exe"
        Move-Item "${{github.workspace}}/build/Debug/clientGUI.exe" "${{github.workspace}}/build/Debug/clientGUI_debug.exe"

    # -------------------------------------------------------------
    # RELEASES SECTOR
    # -------------------------------------------------------------

    - name: Create Rolling Release (On Every Push - DEBUG BUILD)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Development Build (Debug)
        prerelease: true
        files: |
          ${{github.workspace}}/build/Debug/serverGUI_debug.exe
          ${{github.workspace}}/build/Debug/clientGUI_debug.exe

    - name: Create Official Version Release (On Explicit Tag - RELEASE BUILD)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{github.workspace}}/build/Release/serverGUI.exe
          ${{github.workspace}}/build/Release/clientGUI.exe
