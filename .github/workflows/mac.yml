name: macOS CMake Build CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    
    permissions:
      contents: write

    env:
      BUILD_CONFIG: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake (Universal Binary Setup)
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIG }} \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      
    - name: Build Server GUI
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_CONFIG }} --target myservergui

    - name: Build Client GUI
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_CONFIG }} --target myclientgui

    # -------------------------------------------------------------
    # FILE RENAMING (Matches exact target pattern)
    # -------------------------------------------------------------
    - name: Rename Files to Match Target Convention
      shell: bash
      run: |
        SUFFIX=""
        if [ "${{ env.BUILD_CONFIG }}" = "Debug" ]; then SUFFIX="_debug"; fi
        
        # Formats: clientGUI_mac_debug or clientGUI_mac
        mv "${{github.workspace}}/build/bin/myclientgui" "${{github.workspace}}/build/bin/clientGUI_mac${SUFFIX}"
        mv "${{github.workspace}}/build/bin/myservergui" "${{github.workspace}}/build/bin/serverGUI_mac${SUFFIX}"

    # -------------------------------------------------------------
    # RELEASES SECTOR
    # -------------------------------------------------------------
    - name: Create Rolling Release (On Every Push - DEBUG BUILD)
      if: ${{ env.BUILD_CONFIG == 'Debug' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Development Build (Debug)
        prerelease: true
        files: |
          ${{github.workspace}}/build/bin/serverGUI_mac_debug
          ${{github.workspace}}/build/bin/clientGUI_mac_debug

    - name: Create Official Version Release (On Explicit Tag - RELEASE BUILD)
      if: ${{ env.BUILD_CONFIG == 'Release' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{github.workspace}}/build/bin/serverGUI_mac
          ${{github.workspace}}/build/bin/clientGUI_mac
