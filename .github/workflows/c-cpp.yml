name: Windows CMake Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build serverGUI
      run: cmake --build ${{github.workspace}}/build --config Release --target myservergui
      
    - name: Build clientGUI
      run: cmake --build ${{github.workspace}}/build --config Release --target myclientgui
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{github.workspace}}/build/Release/serverGUI.exe
          ${{github.workspace}}/build/Release/clientGUI.exe
